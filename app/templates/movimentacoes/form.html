<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimentação - Adega Premium</title>
    <link rel="stylesheet" href="/static/css/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap' );

        .form-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 150px);
            padding: 20px;
        }

        .form-card {
            width: 100%;
            max-width: 550px;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(245, 227, 163, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(245, 227, 163, 0.05);
            position: relative;
            overflow: hidden;
        }

        .form-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .form-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .form-title i {
            font-size: 32px;
            color: var(--accent);
            margin-bottom: 15px;
            filter: drop-shadow(0 0 8px rgba(245, 227, 163, 0.4));
        }

        .form-title h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            letter-spacing: 3px;
            color: var(--accent);
            text-transform: uppercase;
        }

        .form-group { margin-bottom: 24px; }

        .form-group label {
            display: block;
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .form-group select, .form-group input, .form-group textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 18px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .form-group select:focus, .form-group input:focus, .form-group textarea:focus {
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px rgba(245, 227, 163, 0.1);
        }

        .btn-actions { display: flex; gap: 16px; margin-top: 40px; }

        .btn-primary {
            flex: 2;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-primary:hover {
            background: #fff;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(245, 227, 163, 0.2);
        }

        .btn-secondary {
            flex: 1;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            text-decoration: none;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            transition: 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <main class="conteudo">
            <header>
                <div class="logo">
                    <div class="icone"><i class="fa-solid fa-wine-glass"></i></div>
                    <div><h2>Adega Premium</h2><span>ESTOQUE</span></div>
                </div>
            </header>

            <div class="form-wrapper">
                <div class="form-card">
                    <div class="form-title">
                        <i class="fa-solid fa-arrow-right-arrow-left"></i>
                        <h2>Nova Movimentação</h2>
                    </div>
                    
                    <form action="/movimentacoes/nova" method="POST">
                        <div class="form-group">
                            <label>Produto</label>
                            <select name="produto_id" required>
                                <option value="" disabled selected>Selecione o produto...</option>
                                {% for p in produtos %}
                                <option value="{{ p.id }}">{{ p.nome }} (Estoque: {{ p.estoque_atual }})</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Operação</label>
                            <select name="tipo" required>
                                <option value="Entrada">Entrada (+)</option>
                                <option value="Saída">Saída (-)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Quantidade</label>
                            <input type="number" name="quantidade" min="1" required placeholder="0">
                        </div>

                        <div class="form-group">
                            <label>Observação</label>
                            <textarea name="observacao" rows="3" placeholder="Motivo da movimentação..."></textarea>
                        </div>

                        <div class="btn-actions">
                            <a href="/movimentacoes" class="btn-secondary">CANCELAR</a>
                            <button type="submit" class="btn-primary">REGISTRAR</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
