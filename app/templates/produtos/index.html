<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos — Adega Premium</title>
    <link rel="stylesheet" href="/static/css/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <main class="conteudo">
            <header>
                <div class="logo">
                    <div class="icone"><i class="fa-solid fa-wine-glass"></i></div>
                    <div>
                        <h2>Adega Premium</h2>
                        <span>Gestão de Produtos</span>
                    </div>
                </div>
            </header>

            <nav>
                <a href="/"><i class="fa-solid fa-cart-shopping"></i> Ponto de Venda</a>
                <a href="/movimentacoes"><i class="fa-solid fa-chart-line"></i> Histórico</a>
                <a href="/produtos" class="ativo"><i class="fa-solid fa-box"></i> Produtos</a>
                <a href="/clientes"><i class="fa-solid fa-users"></i> Clientes</a>
                <a href="/auth/logout"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
            </nav>

            <section class="barra-acao">
                <a href="/produtos/novo" class="btn-novo">
                    <i class="fa-solid fa-plus"></i> Novo Produto
                </a>
            </section>

            <section class="conteudo-principal">
                <table class="tabela">
                    <thead>
                        <tr>
                            <th>Imagem</th>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Preço</th>
                            <th>Estoque</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for p in produtos %}
                        <tr>
                            <td><img src="{{ p.imagem_url }}" alt="{{ p.nome }}" class="tabela-img"></td>
                            <td><strong>{{ p.nome }}</strong></td>
                            <td>{{ p.categoria.nome if p.categoria else '—' }}</td>
                            <td>R$ {{ "%.2f"|format(p.preco ) }}</td>
                            <td>
                                <span class="badge {{ 'badge-baixo' if p.estoque_baixo else 'badge-ok' }}">
                                    {{ p.estoque_atual }} un
                                </span>
                            </td>
                            <td>
                                <a href="/produtos/{{ p.id }}/editar" class="btn-acao btn-editar">
                                    <i class="fa-solid fa-pen"></i>
                                </a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</body>
</html>
